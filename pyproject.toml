[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "shellbouncer"
version = "0.1.0"
description = "A firewall for AI coding agents: one policy file that blocks rm -rf, secret leaks and curl | sh in Claude Code, Codex and Gemini CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Saad Rahman" }]
keywords = ["ai-agents", "claude-code", "codex", "gemini-cli", "security", "sandbox", "hooks", "guardrails", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SaadRahman01/shellbouncer"
Issues = "https://github.com/SaadRahman01/shellbouncer/issues"

[project.scripts]
shellbouncer = "shellbouncer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/shellbouncer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B007"]
