name: False positive
description: shellbouncer blocked or asked about a command that should be fine
labels: [false-positive]
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command (remove anything private)
      placeholder: rm -rf ./dist
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of `shellbouncer check '<command>'`
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it should be allowed
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code, Codex CLI, Gemini CLI, Other / CLI only]
